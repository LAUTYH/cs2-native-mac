name: macOS launcher and inspector

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  synthetic-tests:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build and test without game files or downloads
        run: make check
      - name: Verify native launcher architecture and signature
        run: |
          lipo -verify_arch arm64 '.build/CS2 en Mac.app/Contents/MacOS/cs2mac'
          codesign --verify --strict '.build/CS2 en Mac.app'
